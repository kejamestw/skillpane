name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    # Real Windows launcher regressions spawn PowerShell repeatedly; hosted
    # runners need a larger total budget. Each invocation still times out at 60s.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 10 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic unit and security tests
        run: python -B -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/management.js
          node --check web/prompts.js
          node --check web/changes.js
          node --check tests/browser-regression.js
          node --check tests/browser-management.js
          node --check tests/browser-security.js
          node --check tests/browser-prompts.js
      - name: Publication boundaries
        run: python scripts/check_publication.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Install test browsers
        run: npx --no-install playwright install --with-deps chromium firefox
      - name: Synthetic browser regressions
        run: npm run test:browser
      # No screenshot, trace, video or fixture artifacts are uploaded.

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check private paths in history
        run: python3 scripts/check_publication.py --history
      - name: Verify and run Gitleaks (no secret reports uploaded)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts=--all --redact=100 --no-banner --exit-code 1
